server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        expires -1;
    }
    location /static/ {
        try_files $uri =404;
        expires 1y;
    }
    location /api/ {
        proxy_pass http://runtime:8080;
        proxy_set_header Host $host;
        # Overwrite any client-supplied X-Forwarded-For with the real peer; the runtime trusts only this nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
