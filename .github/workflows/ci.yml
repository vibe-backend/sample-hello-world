name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with fake provider and summarize locks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/vibe-backend/sdk/v1.0.0-rc.5/scripts/vibe-install.sh -o vibe-install.sh
          sh vibe-install.sh install --version v1.0.0-rc.5
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          LLM_PROVIDER=fake vibe build --check
          LLM_PROVIDER=fake vibe build
          while IFS= read -r -d '' lock; do
            {
              printf '### %s\n\n```markdown\n' "$lock"
              cat "$lock"
              printf '\n```\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(git ls-files -z -o --ignored --exclude-standard -- '*.lock.md')
      - name: Build keyless test image
        run: docker build -t sample-hello-world:ci backend
      - name: Hello and counter API tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hello -p 8080:8080 sample-hello-world:ci
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then docker logs hello; fi
            docker rm -f hello >/dev/null 2>&1 || true
            docker network rm counter-alt >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /tmp/hello-body -w '%{http_code}' http://127.0.0.1:8080/api/web/v1/hello || true)
            if [ "$status" = 200 ] && jq -e '. == {"message":"hello world"}' /tmp/hello-body >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready" || exit 1
          expect() {
            local method=$1 url=$2 filter=$3 status
            status=$(curl -sS -o /tmp/api-body -w '%{http_code}' -X "$method" "$url")
            printf '%s %s: %s %s\n' "$method" "$url" "$status" "$(cat /tmp/api-body)"
            [ "$status" = 200 ]
            jq -e "$filter" /tmp/api-body >/dev/null
          }
          B=http://127.0.0.1:8080
          expect GET "$B/api/web/v1/counter" '. == {"value":0}'
          expect POST "$B/api/web/v1/increment-counter" '. == {"value":1}'
          expect GET "$B/api/web/v1/counter" '. == {"value":1}'
          # The SDK runtime fixes public writes at 50 per client IP per day.
          # The sequential POST used one; send the 50 concurrent POSTs from a second
          # client address by attaching hello to a second Docker network and calling its address there.
          docker network create counter-alt >/dev/null
          docker network connect counter-alt hello
          alt=$(docker inspect -f '{{(index .NetworkSettings.Networks "counter-alt").IPAddress}}' hello)
          test -n "$alt"
          seq 50 | xargs -P 50 -I{} curl -sS -o - -w '\n%{http_code}\n' -X POST "http://$alt:8080/api/web/v1/increment-counter" > /tmp/concurrent
          awk '/^[0-9][0-9][0-9]$/ { n++; if ($0 != "200") bad++ } END { exit !(n == 50 && bad == 0) }' /tmp/concurrent
          grep '^{' /tmp/concurrent | jq -s -e 'map(.value) | sort == [range(2;52)]' >/dev/null
          printf '%s\n' 'concurrent: 50 x 200, values 2..51 unique'
          expect GET "$B/api/web/v1/counter" '. == {"value":51}'
          expect GET "$B/api/web/v1/hello" '. == {"message":"hello world"}'
      - name: Scan all image layers and configuration
        shell: bash
        run: |
          set -euo pipefail
          docker save sample-hello-world:ci -o image.tar
          scan=$(mktemp -d)
          trap 'rm -rf "$scan"' EXIT
          mkdir "$scan/archive" "$scan/layers"
          tar -xf image.tar -C "$scan/archive"
          layers=0
          for layer in "$scan"/archive/blobs/sha256/* "$scan"/archive/*/layer.tar; do
            [ -f "$layer" ] || continue
            if ! tar -tf "$layer" > "$scan/entries" 2>/dev/null; then continue; fi
            layers=$((layers + 1))
            for name in signing.key .env llm_api_key; do
              count=$(awk -F/ -v name="$name" '$NF == name { n++ } END { print n+0 }' "$scan/entries")
              printf '%s entries: %s\n' "$name" "$count"
              [ "$count" -eq 0 ] || exit 1
            done
            # Keep each layer separate so later whiteouts/overwrites cannot hide secrets.
            mkdir "$scan/layers/$layers"
            tar -xf "$layer" -C "$scan/layers/$layers"
          done
          [ "$layers" -gt 0 ]
          grep -raEl 'sk-[A-Za-z0-9_-]{20,}|LLM_API_KEY=' "$scan/layers" >> "$scan/matches" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
          # Debian base binaries such as /usr/bin/sqv embed the PEM header literal; real PEM keys are text files
          grep -rIlE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' "$scan/layers" >> "$scan/matches" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
          find "$scan/layers" -type f \( -name "*.key" -o -name "*.pem" \) -print >> "$scan/matches"
          if [ -s "$scan/matches" ]; then
            cat "$scan/matches"
            exit 1
          else
            printf 'Layers scanned: %s\n' "$layers"
          fi
          docker history --no-trunc --format '{{.CreatedBy}}' sample-hello-world:ci > "$scan/history"
          if grep -qE 'LLM_API_KEY|llm_api_key=|sk-[A-Za-z0-9]' "$scan/history"; then
            printf '%s\n' 'Forbidden value in image history'
            exit 1
          fi
          docker image inspect --format '{{json .Config.Env}}' sample-hello-world:ci > "$scan/env.json"
          jq -e 'all(.[]; startswith("LLM_") | not) and (index("VIBE_ALLOW_TEST_BUILD=1") != null)' "$scan/env.json" >/dev/null
          test "$(docker image inspect --format '{{.Config.User}}' sample-hello-world:ci)" = 10001
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke test compose
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose logs; docker compose down; docker network rm counter-alt >/dev/null 2>&1 || true' EXIT
          docker compose up -d --build
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/ > /tmp/frontend-index &&
               grep -q '<div id="root">' /tmp/frontend-index &&
               curl -fsS http://127.0.0.1:8081/api/web/v1/hello > /tmp/frontend-hello &&
               jq -e '. == {"message":"hello world"}' /tmp/frontend-hello >/dev/null; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/some/spa/route)" = 200
              ready=true
              break
            fi
            sleep 1
          done
          "$ready" || exit 1
          status=$(curl -sS -o /tmp/frontend-counter -w '%{http_code}' http://127.0.0.1:8081/api/web/v1/counter)
          printf 'GET counter: %s %s\n' "$status" "$(cat /tmp/frontend-counter)"
          [ "$status" = 200 ]
          jq -e '. == {"value":0}' /tmp/frontend-counter >/dev/null
          status=$(curl -sS -o /tmp/frontend-counter -w '%{http_code}' -X POST http://127.0.0.1:8081/api/web/v1/increment-counter)
          printf 'POST counter: %s %s\n' "$status" "$(cat /tmp/frontend-counter)"
          [ "$status" = 200 ]
          jq -e '. == {"value":1}' /tmp/frontend-counter >/dev/null
          # nginx overwrites X-Forwarded-For with the real client address and the runtime trusts only nginx,
          # so fake XFF values must all count against the same real client IP (50 public writes per IP per day).
          # The POST above used 1.
          post_counter() {
            curl -sS -o /tmp/spoof-body -w '%{http_code}' -X POST \
              -H "X-Forwarded-For: $1" http://127.0.0.1:8081/api/web/v1/increment-counter
          }
          for i in $(seq 1 49); do
            status=$(post_counter "203.0.113.$i")
            if [ "$status" != 200 ] || ! jq -e --argjson n $((i + 1)) '.value == $n' /tmp/spoof-body >/dev/null; then
              printf 'spoof: i=%s status=%s body=%s\n' "$i" "$status" "$(cat /tmp/spoof-body)"
              exit 1
            fi
          done
          status=$(post_counter "198.51.100.7")
          [ "$status" = 429 ]
          jq -e '.error.code == "RATE_LIMITED"' /tmp/spoof-body >/dev/null
          printf '%s\n' 'spoof: 49 POSTs with fake X-Forwarded-For counted against one client; 51st write -> 429 RATE_LIMITED'
          # A different real client through nginx still has its own quota.
          fe=$(docker compose ps -q frontend)
          docker network create counter-alt >/dev/null
          docker network connect counter-alt "$fe"
          alt=$(docker inspect -f '{{(index .NetworkSettings.Networks "counter-alt").IPAddress}}' "$fe")
          test -n "$alt"
          status=$(curl -sS -o /tmp/spoof-body -w '%{http_code}' -X POST "http://$alt:8080/api/web/v1/increment-counter")
          [ "$status" = 200 ]
          jq -e '.value == 51' /tmp/spoof-body >/dev/null
          printf '%s\n' 'control: a different real client via nginx -> 200 {"value":51}'
          status=$(curl -sS -o /tmp/frontend-counter -w '%{http_code}' http://127.0.0.1:8081/api/web/v1/counter)
          [ "$status" = 200 ]
          jq -e '. == {"value":51}' /tmp/frontend-counter >/dev/null
          exit 0
