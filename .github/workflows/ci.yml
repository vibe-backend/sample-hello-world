name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Until v1.0.0-rc.2 assets are published, download fails.
      # Re-run via workflow_dispatch after publication.
      - name: Build keyless test image
        run: DOCKER_BUILDKIT=1 docker build --build-arg VIBE_FAKE=1 -t sample-hello-world:ci .
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hello -p 8080:8080 sample-hello-world:ci
          trap 'docker stop hello >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /tmp/hello-body -w '%{http_code}' http://127.0.0.1:8080/hello/v1/dev/hello || true)
            if [ "$status" = 200 ] && jq -e '. == {"message":"hello world"}' /tmp/hello-body >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs hello
          exit 1
      - name: Scan all image layers and configuration
        shell: bash
        run: |
          set -euo pipefail
          docker save sample-hello-world:ci -o image.tar
          scan=$(mktemp -d)
          trap 'rm -rf "$scan"' EXIT
          mkdir "$scan/archive" "$scan/layers"
          tar -xf image.tar -C "$scan/archive"
          layers=0
          for layer in "$scan"/archive/blobs/sha256/* "$scan"/archive/*/layer.tar; do
            [ -f "$layer" ] || continue
            if ! tar -tf "$layer" > "$scan/entries" 2>/dev/null; then continue; fi
            layers=$((layers + 1))
            for name in signing.key .env llm_api_key; do
              count=$(awk -F/ -v name="$name" '$NF == name { n++ } END { print n+0 }' "$scan/entries")
              printf '%s entries: %s\n' "$name" "$count"
              [ "$count" -eq 0 ] || exit 1
            done
            # Keep each layer separate so later whiteouts/overwrites cannot hide secrets.
            mkdir "$scan/layers/$layers"
            tar -xf "$layer" -C "$scan/layers/$layers"
          done
          [ "$layers" -gt 0 ]
          grep -raEl 'sk-[A-Za-z0-9_-]{20,}|LLM_API_KEY=' "$scan/layers" >> "$scan/matches" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
          # Debian base binaries such as /usr/bin/sqv embed the PEM header literal; real PEM keys are text files
          grep -rIlE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' "$scan/layers" >> "$scan/matches" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
          find "$scan/layers" -type f \( -name "*.key" -o -name "*.pem" \) -print >> "$scan/matches"
          if [ -s "$scan/matches" ]; then
            cat "$scan/matches"
            exit 1
          else
            printf 'Layers scanned: %s\n' "$layers"
          fi
          docker history --no-trunc --format '{{.CreatedBy}}' sample-hello-world:ci > "$scan/history"
          if grep -qE 'LLM_API_KEY|llm_api_key=|sk-[A-Za-z0-9]' "$scan/history"; then
            printf '%s\n' 'Forbidden value in image history'
            exit 1
          fi
          docker image inspect --format '{{json .Config.Env}}' sample-hello-world:ci > "$scan/env.json"
          jq -e 'all(.[]; startswith("LLM_") | not) and (index("VIBE_ALLOW_TEST_BUILD=1") != null)' "$scan/env.json" >/dev/null
          test "$(docker image inspect --format '{{.Config.User}}' sample-hello-world:ci)" = 10001
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke test compose
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose logs; docker compose down' EXIT
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/ > /tmp/frontend-index &&
               grep -q '<div id="root">' /tmp/frontend-index &&
               curl -fsS http://127.0.0.1:8081/hello/v1/dev/hello > /tmp/frontend-hello &&
               jq -e '. == {"message":"hello world"}' /tmp/frontend-hello >/dev/null; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/some/spa/route)" = 200
              exit 0
            fi
            sleep 1
          done
          exit 1
